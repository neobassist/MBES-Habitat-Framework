name: mbes-habitat-framework
channels:
  - conda-forge

# Compatibility environment captured from the local `mbes_seaweed` environment
# on 2026-08-12. These versions import successfully together on macOS arm64.
# They are not asserted to be the exact historical versions used to generate
# every archived scientific artifact.
dependencies:
  - python=3.11.14
  - numpy=1.26.4
  - pandas=2.2.2
  - scipy=1.13.1
  - scikit-learn=1.5.1
  - rasterio=1.3.10
  - geopandas=0.14.4
  - shapely=2.0.2
  - pyproj=3.6.1
  - fiona=1.9.6
  - gdal=3.9.1
  - matplotlib=3.10.7
  - joblib=1.4.2
  - pyyaml=6.0.3
  - lightgbm=4.6.0
  - xgboost=2.1.1
  - catboost=1.2.7
