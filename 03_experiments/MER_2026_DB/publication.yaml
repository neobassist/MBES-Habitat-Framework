      Top-performing model-feature combinations within each validation scope. Each scope contains its five highest
      stored mean average-precision (AP) results without forced inclusion of a reference combination. Random Forest
      with the Full 10-band feature set is therefore absent when it ranks below the top five. Scope rank is recalculated
      within one site or transfer direction; rank 1 is best. Receiver operating characteristic area under the curve
      (ROC AUC) and AP are threshold independent. Within-site and cross-site values are means across five seeds;
      spatial block cross-validation (CV) values are means across 25 fold-runs (five seeds by five folds), not pooled
      out-of-fold estimates. Final integrated selection is reported separately in Table 3.'
  - id: table_03_final_candidate_selection
    number: Table 3
    role: main
    order: 3
    title: Final candidate comparison and selection
    stem: table_03_final_candidate_selection
    builder: final_candidate_selection_summary
    paired_figure_ids:
    - fig_07_final_candidate_comparison
    caption: 'Table 3. Final candidate comparison and selection.


      Comparison of the four final candidates in the same order used in Figure 7. Average precision
      (AP) is summarized separately for within-site, cross-site, and spatial block cross-validation (CV). Integrated
      AP is the equal-weight arithmetic mean of those three AP values; it is neither sample weighted nor a pooled
      AP. Minimum AP and AP range summarize robustness across validation strategies and should not be interpreted
      as confidence intervals.'
  - id: table_04_primary_habitat_prediction_summary
    number: Table 4
    role: main
    order: 4
    title: Final habitat prediction summary
    stem: table_04_primary_habitat_prediction_summary
    builder: primary_habitat_summary
    paired_figure_ids:
    - fig_09_predicted_habitat_maps
    caption: 'Table 4. Final habitat prediction summary.


      Mapped habitat extent for the primary balanced Full 10-band Random Forest candidate. Each row represents one site. Valid
      mapped area includes only finite prediction pixels accepted by the final feature mask; NoData and invalid
      feature cells are excluded. Predicted habitat uses the fixed pixel probability threshold p >= 0.5. Habitat
      ratio equals predicted habitat extent divided by valid mapped area. Areas derive from the 0.07 m raster grid
      and are reported in hectares (ha).'
  - id: table_s01_feature_set_composition
    number: Table S1
    role: supplementary
    order: 1
    title: Feature-set definitions and composition
    stem: table_s01_feature_set_composition
    builder: feature_set_definitions
    paired_figure_ids:
    - fig_03_mbes_feature_definitions
    caption: 'Table S1. Feature-set definitions and composition.


      Definitions and composition of the seven feature sets used throughout model training and validation. Each
      row is one feature set; frequencies and reference frequency are in kHz. Feature counts separate acoustic intensity,
      normalized difference index (NDI), bathymetric terrain, and texture predictors.'
  - id: table_s02_model_configuration
    number: Table S2
    role: supplementary
    order: 2
    title: Model configuration and hyperparameters
    stem: table_s02_model_configuration
    builder: model_config_summary
    paired_figure_ids:
    - fig_02_workflow_validation_framework
    caption: 'Table S2. Model configuration and hyperparameters.


      YAML-defined classifier configurations for Random Forest, LightGBM, CatBoost, and XGBoost. Each row is one
      model. Key configuration provides a concise reader-facing summary. Complete model parameters are provided
      in the JSON configuration column, including the model-specific runtime seed key.'
  - id: table_s03_full_within_site_results
    number: Table S3
    role: supplementary
    order: 3
    title: Full within-site validation results
    stem: table_s03_full_within_site_results
    builder: validation_publication_summary
    parameters:
      validation_source: within_site
    paired_figure_ids:
    - fig_s01_within_site_validation
    caption: 'Table S3. Full within-site validation results.


      Within-site performance for every site, model, and feature set. Each row is a mean across five seed-specific
      held-out test subsets. Average precision (AP) and receiver operating characteristic area under the curve (ROC
      AUC) are threshold independent. Precision, recall, and F1 use the stored precision-target threshold policy
      (target 0.90); all 280 runs met that target. Variability and full threshold provenance remain in the unnumbered
      validation source data.'
  - id: table_s04_full_cross_site_results
    number: Table S4
    role: supplementary
    order: 4
    title: Full cross-site transfer results
    stem: table_s04_full_cross_site_results
    builder: validation_publication_summary
    parameters:
      validation_source: cross_site
    paired_figure_ids:
    - fig_s02_cross_site_validation
    caption: 'Table S4. Full cross-site transfer results.


      Directional cross-site transfer performance for every model and feature set. Each row is a mean across five
      seeds evaluated on the complete target-site dataset; transfer directions are not pooled. AP and ROC AUC are
      threshold independent. Precision, recall, and F1 combine stored precision-target thresholds with fixed 0.5
      fallbacks: 89 of 280 runs met the 0.90 target and 191 used fallback. The detailed threshold outcomes remain
      in the unnumbered validation source data.'
  - id: table_s05_full_spatial_cv_results
    number: Table S5
    role: supplementary
    order: 5
    title: Full spatial block CV results
    stem: table_s05_full_spatial_cv_results
    builder: validation_publication_summary
    parameters:
      validation_source: spatial_block_cv
    paired_figure_ids:
    - fig_s03_spatial_block_cv_validation
    caption: 'Table S5. Full spatial block CV results.


      Spatial-block cross-validation (CV) performance for every site, model, and feature set. Each row is the mean
      across 25 fold-runs (five seeds by five folds); these are not 25 independent experiments and are not pooled
      out-of-fold (OOF) predictions. AP and ROC AUC are threshold independent. Of 1,400 fold-runs, 874 met the 0.90
      precision target and 526 used threshold 0.5; threshold-dependent precision, recall, and F1 should therefore
      be interpreted with the detailed threshold provenance provided in the unnumbered validation source data.'
  - id: table_s06_rank_stability_shift
    number: Table S6
    role: supplementary
    order: 6
    title: Rank stability and rank shift
    stem: table_s06_rank_stability_shift
    builder: rank_stability_shift_summary
    paired_figure_ids:
    - fig_s05_ranking_stability
    - fig_s06_final_candidate_analysis
    caption: 'Table S6. Rank stability and rank shift.


      Rank stability of model, feature-set, and model-feature entities across validation strategies. Rank 1 is best.
      Integrated AP is the equal-weight mean of within-site, cross-site, and spatial block CV AP, not a pooled or sample-weighted
      metric. Rank shifts are defined as later minus earlier rank: positive values indicate deterioration, negative
      values improvement, and zero no change. Shifts are available only for model-feature entities; other entries
      are NA. rank_stability_order is the stored ordering from Stage 11 based on increasing mean rank, then rank
      range and Integrated AP.'
  - id: table_s07_final_candidate_map_statistics
    number: Table S7
    role: supplementary
    order: 7
    title: Final candidate map statistics
    stem: table_s07_final_candidate_map_statistics
    builder: final_candidate_map_statistics
    paired_figure_ids:
    - fig_s06_final_candidate_analysis
    caption: 'Table S7. Final candidate map statistics.


      Site-level map statistics for all four final candidates (two sites by four candidates). Probability
      statistics were calculated only from pixels classified as habitat (p >= 0.5), whereas habitat ratio was calculated
      relative to the full valid mapped area. Positive-probability quartiles are deterministic approximations from
      a 10,000-bin histogram. NoData and invalid feature cells are excluded from valid mapped area. positive_area_ratio
      is a 0-1 proportion equal to predicted_habitat_area_ha divided by valid_mapped_area_ha, not a percentage.
      Pixel probability is distinct from dataset-level average precision (AP).'
  - id: table_s08_final_feature_importance
    number: Table S8
    role: supplementary
    order: 8
    title: Final-model feature importance
    stem: table_s08_final_feature_importance
    builder: portable_feature_importance
    paired_figure_ids:
    - fig_08_feature_importance
    - fig_s07_feature_importance
    caption: 'Table S8. Final-model feature importance.


      Feature importance for all eight final models (two sites by four candidates), comprising Random Forest and
      CatBoost estimators. Each row is one feature within one final model. Importance uses the model-family-native
      measure and rank is within that model; values are neither permutation importance nor validation performance,
      and scales from different model families are not assumed to be directly calibrated. Feature labels and groups
      match Main Figure 8 and Figure S7.'
  - id: table_s09_representative_validation_hujeong
    number: Table S9
    role: supplementary
    order: 9
    title: 'Representative validation performance: Hujeong'
    stem: table_s09_representative_validation_hujeong
    builder: representative_validation_table
    parameters:
      representative_run: hujeong_validation
    paired_figure_ids:
    - fig_s08_validation_performance_hujeong
    caption: 'Table S9. Representative validation performance: Hujeong.


      Representative Hujeong validation for RF, Full 10-band, seed 42. Within-site uses the held-out test subset,
      spatial block CV pools five OOF folds, and cross-site uses Bongpyeong-to-Hujeong complete target-site predictions.
      sample_count is the number of prediction records; positive and negative counts are actual habitat and non-habitat
      labels. AP and ROC AUC use stored probabilities; true negative (TN), false positive (FP), false negative (FN),
      and true positive (TP) counts use p >= 0.5. No run averaging or confidence interval is applied.'
  - id: table_s10_representative_validation_bongpyeong
    number: Table S10
    role: supplementary
    order: 10
    title: 'Representative validation performance: Bongpyeong'
    stem: table_s10_representative_validation_bongpyeong
    builder: representative_validation_table
    parameters:
      representative_run: bongpyeong_validation
    paired_figure_ids:
    - fig_s09_validation_performance_bongpyeong
    caption: 'Table S10. Representative validation performance: Bongpyeong.


      Representative Bongpyeong validation for RF, Full 10-band, seed 42. Within-site uses the held-out test subset,
      spatial block CV pools five OOF folds, and cross-site uses Hujeong-to-Bongpyeong complete target-site predictions.
      sample_count is the number of prediction records; positive and negative counts are actual habitat and non-habitat
      labels. AP and ROC AUC use stored probabilities; true negative (TN), false positive (FP), false negative (FN),
      and true positive (TP) counts use p >= 0.5. No run averaging or confidence interval is applied.'
