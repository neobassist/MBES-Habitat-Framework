    caption: 'Table 1. Study sites and dataset summary.


      Survey context for the Bongpyeong and Hujeong study sites. Each row represents one survey site. Depth values
      are signed elevations in metres relative to the source vertical datum, so negative values indicate positions
      below that datum. Frequencies are in kilohertz (kHz), and target resolution is the common 0.07 m analysis-grid
      cell size rather than survey positional accuracy.'
