    source_lineage: project configuration; experiment matrix; final_model_provenance
    caption: Figure 2. Multibeam echosounder (MBES) habitat-prediction workflow and validation framework. Panels
      (a-h) trace MBES acquisition, preprocessing, environmental-feature generation, labeled sampling, the model
      by feature-set experiment matrix, within-site validation, directional cross-site transfer, spatial block cross-validation
      (CV), integrated candidate selection, and final retraining and habitat mapping. Within-site validation uses
      held-out samples from the same site, cross-site validation trains on one site and evaluates the other, and
      spatial block CV separates geographically defined folds. Table 1 summarizes site context and Table S2 gives
      the model configurations; the diagram describes process rather than performance magnitude.
