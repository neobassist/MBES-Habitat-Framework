    source_lineage: final-map feature_importance artifacts; final_model_provenance
    caption: >-
      Figure 8. Model-native feature importance across the final Random Forest and CatBoost site-candidate models.
      Before cross-model summaries, each final model's importances were converted to within-model shares summing to
      one so that the Random Forest and CatBoost native scales received equal model weight. Panel (a) summarizes mean
      shares for individual features. Panel (b) shows mean feature-group importance: within each of the eight final
      site-candidate models, normalized feature-importance shares were first summed within the acoustic-intensity,
      frequency-difference, bathymetric, and texture groups, with groups absent from a candidate feature set
      contributing zero, and the resulting group totals were then averaged equally across models. These are normalized
      model-native importances (impurity-based for Random Forest), not permutation importance, causal effects,
      ecological effect sizes, or validation metrics. Table S8 provides the complete raw site- and candidate-specific values.
