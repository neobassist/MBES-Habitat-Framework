    paired_source_data_ids: []
    manuscript_role: Methods feature concepts
    source_lineage: feature-set configuration; Stage 02 and Stage 03 feature definitions
    caption: Figure 3. Concepts represented by the MBES-derived environmental features. Panel (a) shows 200, 300,
      and 400 kHz acoustic layers normalized within six depth-quantile bins by median centering and a P90-P10
      denominator (minimum 100 valid cells per bin; epsilon 1e-6; no 0-1 clipping). Panel (b) shows configured
      frequency-difference indices calculated as (high-low)/(abs(high)+abs(low)), with a zero denominator treated
      as invalid. Panel (c) shows robust depth and local relative depth based on a local median and IQR. Panel (d)
      shows Gaussian low-pass (sigma 6), high-pass, and log1p absolute Laplacian texture after Gaussian smoothing
      (sigma 1.5), with robust P5/P95 scaling and configured clipping to +/-5. GLCM is not used. Table S1 lists
      the exact composition of the seven Single, Dual, and Full 10-band sets.
