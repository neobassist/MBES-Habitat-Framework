model:
  id: xgboost
  display_name: XGBoost
  type: xgboost_classifier
  task: binary_classification

params:
  n_estimators: 700
  max_depth: 4
  min_child_weight: 4
  gamma: 0.4
  learning_rate: 0.05
  subsample: 0.8
  colsample_bytree: 0.8
  reg_lambda: 1.0
  tree_method: hist
  n_jobs: -1
  eval_metric: logloss

ensemble:
  use_seeds: true